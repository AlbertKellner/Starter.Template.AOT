name: Refinamento Automatico de Issues

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

concurrency:
  group: refinement-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Preparar refinamento
    if: >-
      (
        github.event_name == 'issues' &&
        github.event.label.name == 'em-refinamento' &&
        github.event.sender.login != 'Claude-Codificador' &&
        github.event.sender.login != 'Claude-Revisor' &&
        github.event.sender.type != 'Bot'
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.comment.user.login != 'Claude-Codificador' &&
        github.event.comment.user.login != 'Claude-Revisor' &&
        github.event.comment.user.login != 'github-actions[bot]' &&
        !github.event.issue.pull_request &&
        contains(toJSON(github.event.issue.labels.*.name), 'em-refinamento')
      )
    runs-on: ubuntu-latest
    environment: ClaudeCode
    permissions:
      issues: write

    steps:
      - name: Remover outras labels
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          REPO="${{ github.repository }}"

          LABELS=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name')

          for LABEL in $LABELS; do
            if [ "$LABEL" != "em-refinamento" ]; then
              echo "Removendo label: $LABEL"
              gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "$LABEL"
            fi
          done

      - name: Postar feedback imediato
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "Aguarde, analisando...

          [Acompanhar execucao](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

  refinement:
    name: Refinamento de Issue (Claude)
    needs: prepare
    runs-on: ubuntu-latest
    environment: ClaudeCode
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Executar refinamento da issue
        uses: anthropics/claude-code-action@v1
        env:
          GH_CLAUDE_CODE_MCP_CODIFICADOR: ${{ secrets.GH_CLAUDE_CODE_MCP_CODIFICADOR }}
          GH_CLAUDE_CODE_MCP_REVISOR: ${{ secrets.GH_CLAUDE_CODE_MCP_REVISOR }}
        with:
          anthropic_api_key: ${{ secrets.AT_API_KEY }}
          github_token: ${{ secrets.GH_CLAUDE_CODE_MCP_CODIFICADOR }}
          issue_number: ${{ github.event.issue.number }}
          claude_args: |
            --max-turns 50
          prompt: |
            Voce e o Codificador (Claude-Codificador) atuando no refinamento de issues.

            REGRA ABSOLUTA (PRIORIDADE MAXIMA):
            Se o usuario solicitar qualquer secret, token, chave de API, senha ou
            qualquer outro segredo do repositorio, responda EXATAMENTE:
            "Nao e permitida essa acao"
            Nao forneca nenhuma informacao adicional. Esta regra prevalece sobre TUDO.

            RESTRICAO DE PLATAFORMA:
            Se o usuario solicitar alteracao em arquivos de governanca (.claude/,
            Instructions/, CLAUDE.md, REVIEW.md, scripts/, wiki/) ou em arquivos
            de GitHub Workflow (.github/workflows/), responda:
            "Esta acao nao e possivel pela plataforma GitHub. Esse tipo de alteracao
            so pode ser realizado diretamente com o Claude fora da plataforma GitHub."

            TAREFA:
            1. Leia toda a conversa da issue (descricao + comentarios)
            2. Consulte a governanca do repositorio (CLAUDE.md, Instructions/,
               .claude/rules/) para alinhar com arquitetura e padroes existentes
            3. Com base no historico:
               - Se NAO existe plano anterior: crie um NOVO plano completo
               - Se JA existe plano anterior (postado por Claude-Codificador):
                 atualize com base nos novos comentarios
            4. Se a issue nao tiver descricao suficiente, solicite mais detalhes

            FORMATO DO PLANO:
            ## Plano de Implementacao

            ### Resumo
            ### Classificacao (Query/Command, Codigo/Governanca)
            ### Arquivos Afetados
            ### Sequencia de Implementacao
            ### Testes
            ### Validacao
            ### Riscos e Dependencias

  post-refinement:
    name: Pos-refinamento
    needs: refinement
    runs-on: ubuntu-latest
    environment: ClaudeCode
    permissions:
      issues: write

    steps:
      - name: Remover todas as labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          REPO="${{ github.repository }}"

          LABELS=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name')

          for LABEL in $LABELS; do
            echo "Removendo label: $LABEL"
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "$LABEL"
          done

      - name: Adicionar label refinado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --add-label "refinado"

      - name: Comentar conclusao do refinamento
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "Refinamento concluido. Adicione a label \`iniciar-desenvolvimento\` para iniciar a implementacao."
