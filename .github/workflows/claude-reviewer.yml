name: Revisão Automática de Pull Request

on:
  pull_request:
    types: [review_requested]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Número do Pull Request'
        required: true
        type: string
      pr_branch:
        description: 'Branch do Pull Request (head.ref)'
        required: true
        type: string

jobs:
  auto-review:
    name: Revisão Automática (Claude-Revisor)
    if: github.event_name == 'workflow_dispatch' || github.event.requested_reviewer.login == 'Claude-Revisor'
    runs-on: ubuntu-latest
    environment: ClaudeCode
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Executar revisão automática de código
        uses: anthropics/claude-code-action@v1
        env:
          GH_CLAUDE_CODE_MCP_CODIFICADOR: ${{ secrets.GH_CLAUDE_CODE_MCP_CODIFICADOR }}
          GH_CLAUDE_CODE_MCP_REVISOR: ${{ secrets.GH_CLAUDE_CODE_MCP_REVISOR }}
        with:
          anthropic_api_key: ${{ secrets.AT_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Execute a skill de revisão automática de código definida em
            `.claude/skills/auto-pr-review/SKILL.md` para o Pull Request
            #${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }} (branch: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_branch || github.event.pull_request.head.ref }}).

            CONTEXTO: Este workflow foi disparado automaticamente porque Claude-Revisor
            foi adicionado como revisor ao PR. O ato de adicionar o revisor é a
            confirmação do usuário — pule a etapa 2 (CONFIRMAR COM USUÁRIO) e
            inicie diretamente o CICLO DE REVISÃO (etapa 3).
          claude_args: |
            --max-turns 100
